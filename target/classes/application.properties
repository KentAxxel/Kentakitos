spring.application.name=kentakitos-backend

# Servidor Tomcat Embebido
server.port=8080

# Conexión a Base de Datos (XAMPP MySQL)
# Asegúrate de que XAMPP esté corriendo y que la base de datos "kentakitos_db" exista.
spring.datasource.url=jdbc:mysql://localhost:3306/kentakitos_db?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=

# JPA / Hibernate Configuración
# update: crea o actualiza las tablas automáticamente basándose en las entidades Java
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

# Nombres de tabla en snake_case
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
