<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kentakitos - Dashboard</title>
    
    <!-- Archivo CSS Principal -->
    <link rel="stylesheet" href="css/styles.css">
    
    <!-- Iconos (Boxicons) para un diseño más limpio -->
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
</head>
<body>

    <div class="app-container">
        <!-- BARRA LATERAL (SIDEBAR) -->
        <aside class="sidebar">
            <div class="logo-container">
                <div class="logo-icon">K</div>
                <h2 class="logo-text">Kentakitos</h2>
            </div>

            <ul class="nav-menu">
                <li class="nav-item active">
                    <a href="/index.html" class="nav-link">
                        <i class='bx bx-grid-alt'></i>
                        <span>Dashboard</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="/usuarios/index.html" class="nav-link">
                        <i class='bx bx-user'></i>
                        <span>Usuarios</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="/roles/index.html" class="nav-link">
                        <i class='bx bx-shield'></i>
                        <span>Roles</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="/permisos/index.html" class="nav-link">
                        <i class='bx bx-key'></i>
                        <span>Permisos</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="/mesas/index.html" class="nav-link">
                        <i class='bx bx-restaurant'></i>
                        <span>Mesas</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="/inventario/index.html" class="nav-link">
                        <i class='bx bx-box'></i>
                        <span>Inventario</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="/productos/index.html" class="nav-link">
                        <i class='bx bx-food-menu'></i>
                        <span>Productos</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="/reportes/index.html" class="nav-link">
                        <i class='bx bx-bar-chart-alt-2'></i>
                        <span>Reportes</span>
                    </a>
                </li>
            </ul>
        </aside>

        <!-- CONTENIDO PRINCIPAL -->
        <main class="main-content">
            <!-- CABECERA -->
            <header class="top-header">
                <div class="page-title">
                    <h1>Dashboard Principal</h1>
                    <p>Bienvenido de nuevo, revisa el resumen de hoy.</p>
                </div>
                
                <div class="header-actions">
                    <div class="search-bar">
                        <i class='bx bx-search'></i>
                        <input type="text" placeholder="Buscar en el sistema...">
                    </div>
                    <button class="profile-btn">
                        <i class='bx bx-bell'></i>
                    </button>
                    
                    <div class="profile-menu">
                        <button class="profile-btn" id="btnProfileDropdown">
                            <span id="headerUsername" class="header-username">Usuario</span>
                            <i class='bx bx-user'></i>
                        </button>
                        <div class="dropdown-content" id="profileDropdown">
                            <a href="#" id="btnLogoutAction"><i class='bx bx-log-out'></i> Cerrar Sesión</a>
                        </div>
                    </div>
                </div>
            </header>

            <!-- TARJETAS DE ESTADÍSTICAS -->
            <section class="stats-grid">
                <div class="stat-card">
                    <div class="stat-info">
                        <h3>Usuarios Totales</h3>
                        <h2>1,245</h2>
                    </div>
                    <div class="stat-icon icon-blue">
                        <i class='bx bx-group'></i>
                    </div>
                </div>

                <div class="stat-card">
                    <div class="stat-info">
                        <h3>Ingresos Mensuales</h3>
                        <h2>S/ 14,500</h2>
                    </div>
                    <div class="stat-icon icon-pink">
                        <i class='bx bx-wallet'></i>
                    </div>
                </div>

                <div class="stat-card">
                    <div class="stat-info">
                        <h3>Nuevos Registros</h3>
                        <h2>+86</h2>
                    </div>
                    <div class="stat-icon icon-purple">
                        <i class='bx bx-trending-up'></i>
                    </div>
                </div>
            </section>

        </main>
    </div>

    <script src="/js/app.js"></script>
</body>
</html>
