<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kentakitos | Login</title>
    <link rel="stylesheet" href="css/styles.css">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background: linear-gradient(135deg, var(--bg-color), #e2e8f0);
        }
        .login-card {
            background: var(--surface);
            padding: 3rem;
            border-radius: var(--border-radius);
            box-shadow: var(--shadow-md);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        .login-card .logo-icon {
            margin: 0 auto 1rem auto;
            width: 60px;
            height: 60px;
            font-size: 2rem;
        }
        .login-card h2 {
            margin-bottom: 2rem;
            color: var(--text-main);
        }
        .input-group {
            margin-bottom: 1.5rem;
            text-align: left;
        }
        .input-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--text-muted);
            font-weight: 500;
            font-size: 0.9rem;
        }
        .input-group input {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            font-family: inherit;
            outline: none;
            transition: var(--transition);
        }
        .input-group input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(67, 97, 238, 0.1);
        }
        .btn-login {
            width: 100%;
            padding: 12px;
            justify-content: center;
            font-size: 1rem;
            margin-top: 1rem;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="logo-icon">K</div>
        <h2>Iniciar Sesión</h2>
        
        <form id="loginForm">
            <div class="input-group">
                <label for="username">Usuario</label>
                <input type="text" id="username" placeholder="Ej: admin" required>
            </div>
            
            <div class="input-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>
            
            <button type="submit" class="btn-primary btn-login">
                Entrar <i class='bx bx-right-arrow-alt'></i>
            </button>
        </form>
    </div>

    <script src="js/auth.js"></script>
</body>
</html>
