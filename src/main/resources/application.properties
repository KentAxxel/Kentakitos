spring.application.name=kentakitos-backend

# Servidor Tomcat Embebido
server.port=8080

# Conexión a Base de Datos (MariaDB Nativo)
spring.datasource.url=jdbc:mysql://localhost:3306/kentakitos_db?createDatabaseIfNotExist=true&serverTimezone=UTC
#spring.datasource.username=kams
 Escribe aquí la contraseña que le asignaste a tu usuario 'kams'. Si no tiene, déjalo en blanco.
spring.datasource.password=kams_2005.
#spring.datasource.username=root
#spring.datasource.password=
# JPA / Hibernate Configuración
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Al usar MariaDB nativa, es mejor usar su propio dialecto en lugar del de MySQL
spring.jpa.database-platform=org.hibernate.dialect.MariaDBDialect

# Nombres de tabla en snake_case
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy

# JWT Configuration
spring.jwt.secret=tu-clave-super-secreta-al-menos-32-caracteres-para-hs256-algorithm-security
spring.jwt.expiration=3600000

# OAuth2 Google Configuration (Reemplaza con tus credenciales)
spring.security.oauth2.client.registration.google.client-id=YOUR_CLIENT_ID_HERE.apps.googleusercontent.com
spring.security.oauth2.client.registration.google.client-secret=YOUR_CLIENT_SECRET_HERE
spring.security.oauth2.client.registration.google.scope=openid,email,profile
spring.security.oauth2.client.provider.google.user-name-attribute=sub

# CORS Configuration
app.cors.allowed-origins=http://localhost:3000,http://127.0.0.1:8080,http://localhost:5173
